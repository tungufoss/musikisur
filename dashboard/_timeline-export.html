<script>
// Timeline tools: copy the timeline (with its legend) to the clipboard as a PNG, or download it.
// html2canvas is loaded from the CDN on the first click only.
(() => {
  const SRC = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  let loading = null;

  function load() {
    if (window.html2canvas) return Promise.resolve(window.html2canvas);
    loading = loading || new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = SRC;
      script.onload = () => resolve(window.html2canvas);
      script.onerror = reject;
      document.head.append(script);
    });
    return loading;
  }

  async function render(target) {
    const html2canvas = await load();
    target.classList.add("tl-exporting");  // shows the title that only belongs in the image
    try {
      return await html2canvas(target, { backgroundColor: "#ffffff", scale: 2, useCORS: true, logging: false });
    } finally {
      target.classList.remove("tl-exporting");
    }
  }

  function download(blob, name) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${name}.png`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }

  document.addEventListener("click", async (event) => {
    const button = event.target.closest(".tl-tools button");
    if (!button) return;
    const tools = button.closest(".tl-tools");
    const status = tools.querySelector(".tl-tools-status");
    const copy = button.classList.contains("tl-copy");
    status.textContent = "Bý til mynd …";
    try {
      const canvas = await render(document.getElementById(tools.dataset.target));
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (copy && navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        status.textContent = "Myndin er komin á klemmuspjaldið.";
      } else {
        download(blob, tools.dataset.file);
        status.textContent = copy ? "Vafrinn leyfir ekki afritun, svo myndin var sótt í staðinn." : "";
      }
    } catch (error) {
      console.error(error);
      status.textContent = "Ekki tókst að búa til mynd.";
    }
  });
})();
</script>
