project:
  type: book
  output-dir: _site
  resources:
    - assets/logo/*.svg
    - assets/logo/*.png
    - assets/covers/*.jpg
    - assets/artists/*.jpg

lang: is

book:
  title: "Tónlistararfurinn"
  subtitle: "Plötuklúbbur Inga — gagnakafið"
  # PNG (exported from musikisur.svg at 192px) because Safari ignores SVG favicons.
  favicon: assets/logo/musikisur.png
  # The logo tops the sidebar on every page.
  sidebar:
    logo: assets/logo/musikisur.svg
    logo-alt: "MÚSÍKISUR"
  repo-url: https://github.com/tungufoss/musikisur
  site-url: https://tungufoss.github.io/musikisur/
  page-footer:
    left: >-
      ![](/assets/logo/musikisur.svg){.footer-logo fig-alt="MÚSÍKISUR"}
      MÚSÍKISUR — stundum reynist lagalisti vera flóknara skjal en hann lítur út fyrir að vera.
    right: >-
      Gögn frá
      [![Spotify](/assets/logo/spotify.svg){.footer-logo}](https://www.spotify.com)
      [![Discogs](/assets/logo/discogs.svg){.footer-logo}](https://www.discogs.com)
      [![TMDB](/assets/logo/tmdb.svg){.footer-logo}](https://www.themoviedb.org)
  chapters:
    - index.qmd
    # BEGIN GENERATED CHAPTERS (python scripts/build_book.py; do not edit by hand)
    - part: decades/1970s.qmd
      chapters:
        - albums/city-to-city.qmd
    - part: "Flytjendur"
      chapters:
        - artists/gerry-rafferty.qmd
    # END GENERATED CHAPTERS
  appendices:
    - methodology.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    # Number chapters only; subheadings stay unnumbered.
    number-depth: 1
    # Wider text column for maps, timelines and tables (Quarto's default body is 800px).
    grid:
      sidebar-width: 260px
      body-width: 1150px
      margin-width: 220px
    include-in-header:
      # Font Awesome (timeline icons such as fa-rug); Bootstrap Icons ship with Quarto.
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
    # Spotify icons open a compact player on the page instead of leaving it.
    include-after-body: _spotify-inline.html
    toc: true

execute:
  echo: false
  warning: false
  freeze: false
  # A fresh kernel per render, so edits to src/music_life show up in `quarto preview`.
  daemon: false
