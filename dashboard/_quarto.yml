project:
  type: book
  output-dir: _site
  resources:
    - assets/logo/*.svg
    - assets/logo/*.png
    - assets/covers/*.jpg
    - assets/artists/*.jpg

lang: is

book:
  title: "Tónlistararfurinn"
  subtitle: "Plötuklúbbur Inga — gagnakafið"
  # PNG (exported from musikisur.svg at 192px) because Safari ignores SVG favicons.
  favicon: assets/logo/musikisur.png
  # The logo tops the sidebar on every page.
  sidebar:
    logo: assets/logo/musikisur.svg
    logo-alt: "MÚSÍKISUR"
  repo-url: https://github.com/tungufoss/musikisur
  site-url: https://tungufoss.github.io/musikisur/
  page-footer:
    left: >-
      ![](/assets/logo/musikisur.svg){.footer-logo fig-alt="MÚSÍKISUR"}
      MÚSÍKISUR — stundum reynist lagalisti vera flóknara skjal en hann lítur út fyrir að vera.
    right: >-
      Gögn frá
      [![MusicBrainz](/assets/logo/musicbrainz.svg "MusicBrainz"){.footer-logo}](https://musicbrainz.org)
      [![Cover Art Archive](/assets/logo/coverartarchive.svg "Cover Art Archive"){.footer-logo}](https://coverartarchive.org)
      [![Discogs](/assets/logo/discogs.svg "Discogs"){.footer-logo}](https://www.discogs.com)
      [![Spotify](/assets/logo/spotify.svg "Spotify"){.footer-logo}](https://www.spotify.com)
      [![Wikidata](/assets/logo/wikidata.svg "Wikidata"){.footer-logo}](https://www.wikidata.org)
      [![Wikipedia](/assets/logo/wikipedia.svg "Wikipedia"){.footer-logo}](https://en.wikipedia.org)
      [![Wikimedia Commons](/assets/logo/commons.svg "Wikimedia Commons"){.footer-logo}](https://commons.wikimedia.org)
      [![TMDB](/assets/logo/tmdb.svg "TMDB"){.footer-logo}](https://www.themoviedb.org)
      [![IMDb](/assets/logo/imdb.svg "IMDb"){.footer-logo}](https://www.imdb.com)
      [![Genius](/assets/logo/genius.svg "Genius"){.footer-logo}](https://genius.com)
      [![Billboard-gögn (utdata/rwd-billboard-data)](/assets/logo/github.svg "Billboard-gögn: utdata/rwd-billboard-data"){.footer-logo}](https://github.com/utdata/rwd-billboard-data)
  chapters:
    - index.qmd
    # BEGIN GENERATED CHAPTERS (python scripts/build_book.py; do not edit by hand)
    - part: "Flytjendur"
      chapters:
        - artists/gerry-rafferty.qmd
    - part: decades/1970s.qmd
      chapters:
        - albums/city-to-city.qmd
    # END GENERATED CHAPTERS
  appendices:
    - methodology.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    # No numbers on chapters, parts or appendices.
    number-sections: false
    # Wider text column for maps, timelines and tables (Quarto's default body is 800px).
    grid:
      sidebar-width: 260px
      body-width: 1150px
      margin-width: 220px
    include-in-header:
      # Font Awesome (timeline icons such as fa-rug); Bootstrap Icons ship with Quarto.
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
    # Spotify icons open a compact player on the page instead of leaving it.
    include-after-body: _spotify-inline.html
    toc: true

execute:
  echo: false
  warning: false
  # A full render re-executes only pages whose .qmd changed; see AGENTS.md after data or code changes.
  freeze: auto
  # A fresh kernel per render, so edits to src/music_life show up in `quarto preview`.
  daemon: false
