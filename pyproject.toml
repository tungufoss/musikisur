[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-life-dashboard"
version = "0.1.0"
description = "Artist and focus-album music biography research pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3",
  "httpx>=0.28",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "jupyter>=1.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
